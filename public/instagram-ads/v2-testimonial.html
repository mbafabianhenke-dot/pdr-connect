<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Inter', sans-serif; }

.card {
  width: 1080px; height: 1080px;
  background: #060d1a;
  position: relative; overflow: hidden;
  display: flex; flex-direction: column;
}

/* Background effects */
.bg-glow-1 {
  position: absolute; width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(29,78,216,0.35) 0%, transparent 70%);
  top: -100px; right: -100px; border-radius: 50%;
}
.bg-glow-2 {
  position: absolute; width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(251,191,36,0.15) 0%, transparent 70%);
  bottom: -100px; left: -50px; border-radius: 50%;
}
.bg-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
}

/* Top bar */
.top-bar {
  position: relative; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 36px 52px 0;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark {
  width: 44px; height: 44px; border-radius: 10px;
  background: linear-gradient(135deg, #1d4ed8, #3b82f6);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; box-shadow: 0 4px 20px rgba(29,78,216,0.5);
}
.logo-name { font-size: 20px; font-weight: 800; color: white; letter-spacing: -0.5px; }

.verified-badge {
  display: flex; align-items: center; gap: 8px;
  background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.3);
  border-radius: 100px; padding: 8px 18px;
}
.verified-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; }
.verified-text { color: #4ade80; font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }

/* Hero section */
.hero {
  position: relative; z-index: 10;
  flex: 1; display: flex; flex-direction: column;
  padding: 48px 52px 0;
}

/* Stars */
.stars { display: flex; gap: 6px; margin-bottom: 28px; }
.star {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, #fbbf24, #f97316);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  box-shadow: 0 4px 12px rgba(251,191,36,0.3);
}

/* Big quote */
.quote-icon { font-size: 100px; color: #1d4ed8; opacity: 0.4; line-height: 0.8; margin-bottom: 24px; font-family: Georgia; }

.quote {
  font-size: 42px; font-weight: 800; color: white;
  line-height: 1.25; letter-spacing: -1px;
  max-width: 900px; margin-bottom: 44px;
}
.quote .highlight {
  background: linear-gradient(135deg, #fbbf24, #f97316);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

/* Author */
.author { display: flex; align-items: center; gap: 20px; margin-bottom: 52px; }
.author-avatar {
  width: 72px; height: 72px; border-radius: 50%;
  background: linear-gradient(135deg, #1d4ed8, #fbbf24);
  padding: 3px;
}
.author-avatar-inner {
  width: 100%; height: 100%; border-radius: 50%;
  background: linear-gradient(135deg, #1e3a5f, #0f172a);
  display: flex; align-items: center; justify-content: center;
  font-size: 30px;
}
.author-name { font-size: 22px; font-weight: 800; color: white; }
.author-title { font-size: 15px; color: rgba(255,255,255,0.5); margin-top: 2px; }
.author-flag { font-size: 22px; }

/* Bottom stats bar */
.stats-bar {
  position: relative; z-index: 10;
  background: rgba(255,255,255,0.04); border-top: 1px solid rgba(255,255,255,0.08);
  display: flex;
}
.stat-item {
  flex: 1; padding: 28px 36px;
  border-right: 1px solid rgba(255,255,255,0.06);
}
.stat-item:last-child { border-right: none; }
.stat-num {
  font-size: 36px; font-weight: 900; color: #fbbf24;
  letter-spacing: -1px; line-height: 1;
}
.stat-label { font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 4px; font-weight: 500; }

/* Accent line */
.accent-line {
  position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, transparent, #1d4ed8, #fbbf24, #1d4ed8, transparent);
}
</style>
</head>
<body>
<div class="card">
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>
  <div class="bg-grid"></div>

  <div class="top-bar">
    <div class="logo">
      <div class="logo-mark">🔧</div>
      <div class="logo-name">PDR Connect</div>
    </div>
    <div class="verified-badge">
      <div class="verified-dot"></div>
      <span class="verified-text">VERIFIED TECHNICIAN</span>
    </div>
  </div>

  <div class="hero">
    <div class="stars">
      <div class="star">⭐</div>
      <div class="star">⭐</div>
      <div class="star">⭐</div>
      <div class="star">⭐</div>
      <div class="star">⭐</div>
    </div>

    <div class="quote-icon">"</div>

    <div class="quote">
      Within 3 days I received<br>
      <span class="highlight">2 job requests from Germany.</span><br>
      Best platform for PDR pros.
    </div>

    <div class="author">
      <div class="author-avatar">
        <div class="author-avatar-inner">👨‍🔧</div>
      </div>
      <div>
        <div class="author-name">Marco R. <span class="author-flag">🇩🇪</span></div>
        <div class="author-title">PDR Technician · 8 years · Germany</div>
      </div>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-num">1000+</div>
      <div class="stat-label">Technicians worldwide</div>
    </div>
    <div class="stat-item">
      <div class="stat-num">48+</div>
      <div class="stat-label">Countries active</div>
    </div>
    <div class="stat-item">
      <div class="stat-num">€0</div>
      <div class="stat-label">Free to join</div>
    </div>
    <div class="stat-item">
      <div class="stat-num">4</div>
      <div class="stat-label">Languages</div>
    </div>
  </div>

  <div class="accent-line"></div>
</div>
</body>
</html>
